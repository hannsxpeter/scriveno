<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 708" width="1200" height="708" role="img" aria-labelledby="t d">
  <title id="t">Scriveno quest map</title>
  <desc id="d">A seven level map from blank page to publish. Level 1 Blank Page: new-work, profile-writer, voice-test. Level 2 Outline: discuss, outline, plan. Level 3 Draft: draft, autopilot. Level 4 Revise: editor-review, continuity-check, voice-check. Level 5 Polish: polish. Level 6 Translate: translate, translation-glossary, back-translate. Level 7 Publish: prepublish-review, compliance-check, publish. The finish is a package ready to upload.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="707" rx="10" fill="#1B1916" stroke="#34312B"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#23211D"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#34312B"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#F2F65A" letter-spacing="1.5">QUEST MAP</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="end">BLANK PAGE TO PUBLISH  7 LEVELS</text>
  <path d="M168 220H1032V532H300" fill="none" stroke="#F2F65A" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
