    <text x="20" y="114" class="sans" font-size="13" fill="#A5A397">Line, copy, and voice pass</text>
    <line x1="20" y1="130" x2="244" y2="130" stroke="#34312B"/>
    <text x="20" y="152" class="mono" font-size="10" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="20" y="176" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:polish</text>
    <line x1="20" y1="232" x2="244" y2="232" stroke="#34312B"/>
    <text x="20" y="254" class="sans" font-size="12" fill="#A5A397">Reward: one chained polish pass</text>
  </g>
  <g transform="translate(612 396)">
    <rect width="264" height="272" rx="4" fill="#23211D" stroke="#34312B"/>
    <text x="20" y="54" class="mono" font-size="38" font-weight="700" fill="#F2F65A">06</text>
    <text x="20" y="92" class="sans" font-size="25" font-weight="700" fill="#EDEDE6">Translate</text>
    <text x="20" y="114" class="sans" font-size="13" fill="#A5A397">Glossary-backed editions</text>
    <line x1="20" y1="130" x2="244" y2="130" stroke="#34312B"/>
    <text x="20" y="152" class="mono" font-size="10" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="20" y="176" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:translate</text>
    <text x="20" y="198" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:translation-glossary</text>
    <text x="20" y="220" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:back-translate</text>
    <line x1="20" y1="232" x2="244" y2="232" stroke="#34312B"/>
    <text x="20" y="254" class="sans" font-size="12" fill="#A5A397">Reward: translated units, drift notes</text>
  </g>
  <g transform="translate(324 396)">
