    <text x="20" y="92" class="sans" font-size="25" font-weight="700" fill="#EDEDE6">Outline</text>
    <text x="20" y="114" class="sans" font-size="13" fill="#A5A397">Shape the work, unit by unit</text>
    <line x1="20" y1="130" x2="244" y2="130" stroke="#34312B"/>
    <text x="20" y="152" class="mono" font-size="10" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
