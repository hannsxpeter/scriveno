    <text x="20" y="54" class="mono" font-size="38" font-weight="700" fill="#F2F65A">07</text>
    <text x="20" y="92" class="sans" font-size="25" font-weight="700" fill="#EDEDE6">Publish</text>
    <text x="20" y="114" class="sans" font-size="13" fill="#A5A397">Gate it, then package it</text>
