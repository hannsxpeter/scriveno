    <text x="20" y="114" class="sans" font-size="13" fill="#A5A397">Capture your voice first</text>
    <line x1="20" y1="130" x2="244" y2="130" stroke="#34312B"/>
    <text x="20" y="152" class="mono" font-size="10" fill="#A5A397" letter-spacing="1.5">CLEAR IT WITH</text>
    <text x="20" y="176" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:new-work</text>
    <text x="20" y="198" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:profile-writer</text>
    <text x="20" y="220" class="mono" font-size="14" font-weight="700" fill="#EDEDE6">/scr:voice-test</text>
    <line x1="20" y1="232" x2="244" y2="232" stroke="#34312B"/>
    <text x="20" y="254" class="sans" font-size="12" fill="#A5A397">Reward: STYLE-GUIDE.md</text>
    <rect x="180" y="20" width="64" height="22" rx="3" fill="#F2F65A"/>
    <text x="212" y="35" class="mono" font-size="12" font-weight="700" fill="#1B1916" text-anchor="middle" letter-spacing="1.5">START</text>
  </g>
  <g transform="translate(324 84)">
    <rect width="264" height="272" rx="4" fill="#23211D" stroke="#34312B"/>
