    <line x1="20" y1="232" x2="244" y2="232" stroke="#34312B"/>
    <text x="20" y="254" class="sans" font-size="12" fill="#A5A397">Reward: OUTLINE.md, unit plans</text>
  </g>
  <g transform="translate(612 84)">
