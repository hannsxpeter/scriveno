      <text x="20" y="124">Commands</text>
      <text x="20" y="168">Installer targets</text>
      <text x="20" y="212">Voice DNA dimensions</text>
      <text x="20" y="256">Work type groups</text>
    </g>
    <g class="mono" font-size="22" font-weight="700" fill="#F2F65A" text-anchor="end">
