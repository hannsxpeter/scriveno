<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Scriveno 4.0.0</title>
  <desc id="d">Scriveno wordmark with the line: drafted prose that sounds like the writer, not like AI. A status board lists 50 work types, 127 commands, 11 installer targets, 15 plus voice dimensions and 9 work type groups. A seven segment level bar shows level one lit.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#1B1916" stroke="#34312B"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#23211D"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#34312B"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#F2F65A" letter-spacing="1.5">SCRIVENO 4.0.0</text>
  <text x="600" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="middle">@hxp-tools/scriveno</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="end">PRESS START  /scr-first-run</text>

  <text x="52" y="188" class="sans" font-size="128" font-weight="800" fill="#EDEDE6" letter-spacing="-4">Scriveno</text>
  <rect x="52" y="208" width="56" height="6" fill="#F2F65A"/>
  <text x="52" y="258" class="sans" font-size="30" font-weight="600" fill="#EDEDE6">Drafted prose that sounds like the writer,</text>
  <text x="52" y="296" class="sans" font-size="30" font-weight="600" fill="#EDEDE6">not like AI.</text>
  <text x="52" y="334" class="sans" font-size="17" fill="#A5A397">A writing, publishing, and translation pipeline for AI coding agents.</text>

  <g transform="translate(776 76)">
