  <title id="t">Scriveno work types</title>
  <desc id="d">Fifty work types in nine groups: Prose 9, Script 6, Academic 6, Technical 4, Visual 4, Poetry 3, Interactive 2, Speech 1, and Sacred and historical 15.</desc>
  <style>
