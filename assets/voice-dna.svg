  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#F2F65A" letter-spacing="1.5">VOICE DNA</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="end">15+ DIMENSIONS, 9 PARTS</text>
  <text x="36" y="84" class="mono" font-size="11" fill="#A5A397" letter-spacing="2">THE WRITER PROFILE</text>
