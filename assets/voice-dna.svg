<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Voice DNA in Scriveno</title>
  <desc id="d">Nine parts of the writer profile, from narrative architecture to always, never, consider, are saved as STYLE-GUIDE.md. It sits on top of WRITING-RULES.md and a per work type pitfall pack, and all three are loaded into the drafter, which writes each unit in a fresh context with the style guide loaded first. voice-test calibrates before drafting and voice-check compares the draft afterwards.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
